{
    "boot_modes": [
        {
            "name": "charger_mode",
            "condition": [
                {
                    "type": "cmdline",
                    "param": "ohos.boot.mode",
                    "value": "charger_mode"
                },
                {
                    "type": "misc",
                    "value": "boot_charge"
                }
            ],
            "actions": [
                {
                    "action": "parse_default_cfg",
                    "path": "/etc/init.cfg"
                },
                {
                    "action": "read_dir",
                    "path": "/system/etc/charger"
                },
                {
                    "action": "parse_priority",
                    "path": "etc/init"
                }
            ]
        },
        {
            "name": "bopd",
            "condition": {
                "type": "cmdline",
                "param": "ohos.boot.bopd.run.status",
                "value": "true"
            },
            "actions": [
                {
                    "action": "parse_priority",
                    "path": "etc/bopd"
                }
            ],
            "fallbackOnEmpty": true
        },
        {
            "name": "charger",
            "condition": {
                "type": "cmdline",
                "param": "ohos.boot.mode",
                "value": "charger"
            },
            "actions": [
                {
                    "action": "read_dir",
                    "path": "/system/etc/charger"
                }
            ]
        },
        {
            "name": "penglai",
            "condition": {
                "type": "cmdline",
                "param": "ohos.boot.minisys.mode",
                "value": "penglai"
            },
            "actions": [
                {
                    "action": "parse_priority",
                    "path": "etc/penglai"
                }
            ]
        },
        {
            "name": "rescue",
            "condition": {
                "type": "cmdline",
                "param": "rescue_mode",
                "value": "true"
            },
            "actions": [
                {
                    "action": "read_dir",
                    "path": "/system/etc/rescue"
                }
            ]
        },
        {
            "name": "maintenance_recovery",
            "condition": [
                {
                    "type": "cmdline",
                    "param": "ohos.boot.maintenance.recovery",
                    "value": "2",
                    "exact": true
                },
                {
                    "type": "cmdline",
                    "param": "ohos.boot.maintenance.recovery",
                    "value": "3",
                    "exact": true
                }
            ],
            "actions": [
                {
                    "action": "read_dir",
                    "path": "/system/etc/maintenance_recovery"
                }
            ]
        },
        {
            "name": "updater",
            "condition": {
                "type": "updater"
            },
            "actions": [
                {
                    "action": "read_dir",
                    "path": "/etc"
                }
            ]
        },
        {
            "name": "default",
            "condition": {
                "type": "default"
            },
            "actions": [
                {
                    "action": "parse_default_cfg",
                    "path": "/etc/init.cfg"
                },
                {
                    "action": "parse_priority",
                    "path": "etc/init"
                }
            ]
        }
    ]
}
